services:
  singularity:
    # Singularity Suite v3.0.9 — WINDOWS variant (Docker Desktop / WSL2)
    # Differences vs the Linux compose (intentional):
    #   - NO privileged / NO /dev/dri / NO group_add  -> HW accel does not exist
    #     under WSL2 virtualization. MKVerything transcodes run on CPU (slow, fine
    #     for testing upload logic, not for batch transcode).
    #   - NO network_mode: host  -> not supported on Docker Desktop Windows.
    #     Local services (qBittorrent / Sonarr / Radarr) are reached via
    #     host.docker.internal. In config/config.py set qbit_url to
    #     http://host.docker.internal (NOT 127.0.0.1).
    #   - NO :z SELinux relabel  -> Windows/Docker Desktop does not use SELinux.
    #   - Media mount is a single folder you edit directly below (no env vars,
    #     no PowerShell), not the Linux /run/media + ~/Descargas + ~/Vídeos set.
    image: rawsmoke/singularity-suite:latest
    container_name: singularity_core
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    env_file: ./config/.env
    command: python3 -m core.dashboard
    environment:
      - TZ=Europe/Madrid
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}

    # host.docker.internal is built-in on Docker Desktop; declared here for parity.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8G

    volumes:
      # --- 1. CONFIGURACIÓN ---
      - ./config/.env:/app/.env
      - ./config/singularity_config.py:/app/singularity_config.py
      - ./config/config.py:/app/RawLoadrr/data/config.py
      - ./config/mass_config.py:/app/extras/MASS-EDITION-UNIT3D/config.py

      # --- 2. WORK DATA & PERSISTENCIA ---
      - ./work_data/mass_editor/ids.txt:/app/extras/MASS-EDITION-UNIT3D/ids.txt
      - ./work_data/mass_editor/completados.txt:/app/extras/MASS-EDITION-UNIT3D/completados.txt
      - ./work_data/mass_editor/completados_img.txt:/app/extras/MASS-EDITION-UNIT3D/completados_img.txt
      - ./work_data/mass_editor/mapeo_maestro.json:/app/extras/MASS-EDITION-UNIT3D/mapeo_maestro.json
      - ./work_data/mass_editor/titulos_mapa.json:/app/extras/MASS-EDITION-UNIT3D/titulos_mapa.json
      - ./work_data/mass_editor/mapeo_por_titulo.json:/app/extras/MASS-EDITION-UNIT3D/mapeo_por_titulo.json
      - ./work_data/tmp:/app/RawLoadrr/tmp
      - ./work_data/logs:/app/logs
      - ./work_data/reports:/app/MKVerything/docs
      - ./work_data/trackers:/app/RawLoadrr/src/trackers
      - ./work_data/reports:/app/work_data/reports

      # --- 3. PERSISTENCIA DE MÓDULOS ---
      - ./work_data/logs/csi_log:/app/extras/CSI/csi_log
      - ./work_data/cookies:/app/RawLoadrr/data/cookies
      - ./work_data/logs/rawloadrr:/app/RawLoadrr/logs
      - ./work_data/logs/mkverything:/app/MKVerything/logs
      - ./work_data/qbit_backup:/app/RawLoadrr/qbit_backup

      # ─────────────────────────────────────────────────────────────
      # 👇 TU BIBLIOTECA DE MEDIOS / YOUR MEDIA LIBRARY
      # Por defecto usa la carpeta "media" junto a este archivo.
      # Para apuntar a TU carpeta real, edita la parte IZQUIERDA de ':'
      #   ejemplo:  - D:\Pelis:/media
      #   (puedes añadir más líneas copiando el patrón)
      - ./media:/media
      # - D:\Series:/media/series      # <- ejemplo: descomenta y edita
      # ─────────────────────────────────────────────────────────────

    stdin_open: true
    tty: true
