services:
  singularity:
    # 1. IMAGEN (LOCAL v1.6)
    image: rawsmoke/singularity-suite:latest
    container_name: singularity_core
    restart: unless-stopped
    # Sin privileged: `devices:` + `group_add` bastan para /dev/dri.
    user: "${PUID:-1000}:${PGID:-1000}"
    group_add:
      - "997"         # Acceso directo al grupo 'render' (AMD/Intel)
      - "107"         # Por si acaso, el grupo 'video' en algunos RHEL
    env_file: ./config/.env
    command: python3 -m core.dashboard
    environment:
      - TZ=Europe/Madrid
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - LIBVA_DRIVER_NAME=radeonsi # Fuerza el driver de AMD
    devices:
      - /dev/dri:/dev/dri # Mapeo explícito del hardware gráfico
      - /dev/fb0:/dev/fb0 # Framebuffer (opcional pero ayuda en probes)

    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 8G

    # 3. VOLÚMENES RE-ALINEADOS
    # --- SELinux -------------------------------------------------------------
    # Los montajes de abajo NO llevan `:z` a propósito.
    #
    # `:z` le pide a Docker que reetiquete el ORIGEN de cada montaje, y lo
    # intenta por llevar la opción puesta, no por que tu sistema use SELinux.
    # El reetiquetado escribe el atributo extendido `security.selinux`, que
    # XFS y ext4 soportan pero NTFS, exFAT, CIFS y NFS no. Si tu biblioteca
    # vive en un disco USB de NTFS o en un NAS -- que es lo normal -- el
    # arranque muere con:
    #
    #     error setting label on mount source '...': operation not supported
    #
    # Y donde SÍ funciona tampoco sale gratis: `:z` reetiqueta de forma
    # RECURSIVA y PERMANENTE los ficheros del host. Sobre una biblioteca de
    # varios TB son cientos de miles de ficheros en cada `up --force-recreate`,
    # y te puede romper otros programas del sistema que tocaran esas rutas.
    #
    # ¿Usas Fedora, RHEL, Rocky o Alma y el contenedor no puede leer tus rutas?
    # Descomenta esto. Exime al contenedor del confinamiento de SELinux sin
    # tocar ni una etiqueta de tus ficheros:
    #
    # security_opt:
    #   - label:disable

    volumes:
      # --- 1. CONFIGURACIÓN (Mantenemos montajes de archivos para estabilidad de 'make') ---
      - ./config/.env:/app/.env
      - ./config/singularity_config.py:/app/singularity_config.py
      - ./config/config.py:/app/RawLoadrr/data/config.py
      - ./config/mass_config.py:/app/extras/MASS-EDITION-UNIT3D/config.py
#      - ./clean_vs_bad_descriptions.txt:/app/clean_vs_bad_descriptions.txt
#      - ./leftover_pixhost_dirs.txt:/app/leftover_pixhost_dirs.txt

      # --- 2. WORK DATA & PERSISTENCIA ---
      - ./work_data/mass_editor/ids.txt:/app/extras/MASS-EDITION-UNIT3D/ids.txt
      - ./work_data/mass_editor/completados.txt:/app/extras/MASS-EDITION-UNIT3D/completados.txt
      - ./work_data/mass_editor/completados_img.txt:/app/extras/MASS-EDITION-UNIT3D/completados_img.txt
      - ./work_data/mass_editor/mapeo_maestro.json:/app/extras/MASS-EDITION-UNIT3D/mapeo_maestro.json
      - ./work_data/mass_editor/titulos_mapa.json:/app/extras/MASS-EDITION-UNIT3D/titulos_mapa.json
      - ./work_data/mass_editor/mapeo_por_titulo.json:/app/extras/MASS-EDITION-UNIT3D/mapeo_por_titulo.json
      - ./work_data/tmp:/app/RawLoadrr/tmp
      - ./work_data/logs:/app/logs
      - ./work_data/reports:/app/MKVerything/docs
      - ./work_data/trackers:/app/RawLoadrr/src/trackers
      - ./work_data/reports:/app/work_data/reports
      
      # --- 3. PERSISTENCIA DE MÓDULOS ---
      - ./work_data/logs/csi_log:/app/extras/CSI/csi_log
      - ./work_data/cookies:/app/RawLoadrr/data/cookies
      - ./work_data/logs/rawloadrr:/app/RawLoadrr/logs
      - ./work_data/logs/mkverything:/app/MKVerything/logs
      - ./work_data/qbit_backup:/app/RawLoadrr/qbit_backup

      # --- 4. EL ARSENAL (30TB) ---
      - /run/media/${USER}:/run/media/${USER}
      # v3.0.0 hardening: dropped blanket ${HOME}:${HOME}. Targeted mounts only.
      - ${HOME}/Descargas:${HOME}/Descargas
      - ${HOME}/Vídeos:${HOME}/Vídeos
      - ${HOME}/Qbit_Docker:${HOME}/Qbit_Docker
      - ./work_data:${HOME}/RaW_Suite_Docker/work_data

    network_mode: host
    stdin_open: true
    tty: true
